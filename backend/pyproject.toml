[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "trust-indicators-backend"
version = "0.1.0"
description = "Backend for a personalised media trust-indicator filter"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<0.116",
    "pillow>=12.0.0",
    "c2pa-python>=0.27.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "google-genai>=1.55.0",
    "python-dotenv>=1.2.1",
    "beautifulsoup4>=4.14.3"
]

[project.scripts]
trust-backend = "app.main:run" # TODO adapt to working entry point as soon as available

[tool.hatch.build.targets.wheel]
packages = ["app", "modules"]
sources = ["src"]