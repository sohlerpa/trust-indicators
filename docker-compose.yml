services:
  db:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: trust-indicators
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db_init:/docker-entrypoint-initdb.d # will auto-initialize the db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d trust-indicators" ]
      interval: 3s
      timeout: 3s
      retries: 2

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/trust-indicators
      GEMINI_API_KEY: your_api_key_here
      FACT_CHECKING_API_KEY: your_api_key_here
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python run.py

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev